name: Verify live game
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  hosted-browser-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Play the complete published case
        run: npm run test:browser
        env:
          GAME_TEST_URL: https://jaychtw.github.io/the-impossible-room/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-game-browser-evidence
          path: |
            playwright-report/
            test-results/
            docs/screenshots/
